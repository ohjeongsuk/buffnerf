spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/buffnerf}
spring.datasource.username=${DB_USERNAME:buffnerf}
spring.datasource.password=${DB_PASSWORD:buffnerf}

# 스키마는 Flyway(db/migration)만 바꾼다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# AI 처리는 한 번에 하나씩 (같은 패치 중복 호출 방지)
spring.task.execution.pool.core-size=1

# LLM: gemini(무료 등급 API 키), ollama(이 PC의 로컬 모델, 무료), claude(유료 API 키)
llm.provider=${LLM_PROVIDER:gemini}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=qwen3:8b
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5-5
steam.api-key=${STEAM_API_KEY:}
admin.key=${ADMIN_KEY:}
