spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/buffnerf}
spring.datasource.username=${DB_USERNAME:buffnerf}
spring.datasource.password=${DB_PASSWORD:buffnerf}

# 스키마는 Flyway(db/migration)만 바꾼다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5-5
steam.api-key=${STEAM_API_KEY:}
admin.key=${ADMIN_KEY:}
